name: Scrape cat listings

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

# A slow run must not overlap with the next scheduled one.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        run: node pipeline/run.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Keeps the scraped listings recoverable when a later stage fails, so a
      # retry can run with --use-cache instead of re-scraping both sites.
      - name: Upload scrape cache on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-cache
          path: pipeline/scrape-cache.json
          retention-days: 7
          if-no-files-found: ignore
